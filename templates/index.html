<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
      background-size: 300% 100%;
      animation: gradient 8s ease infinite;
    }

    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
      border-radius: 10px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      background: #fafbfc;
    }

    input[type="text"]:focus {
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .qr-result {
      margin-top: 24px;
      text-align: center;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .qr-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 16px;
    }

    .qr-container {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      border: 2px solid #e2e8f0;
      position: relative;
    }

    .qr-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      border-radius: 16px;
      z-index: -1;
      opacity: 0.1;
    }

    .qr-container img {
      max-width: 160px;
      height: auto;
      border-radius: 8px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }

    .status-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px;
        margin: 12px;
        max-width: 340px;
      }
      
      h1 {
        font-size: 20px;
      }
    }

    @media (max-height: 600px) {
      .container {
        padding: 20px;
      }
      
      .qr-container img {
        max-width: 140px;
      }
      
      .icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-indicator"></div>
    
    <div class="header">
      <div class="icon">QR</div>
      <h1>QR Generator</h1>
      <p class="subtitle">Create stunning QR codes</p>
    </div>

    <form method="POST">
      <div class="input-group">
        <input type="text" name="data" placeholder="Enter your text, URL, or message..." required>
      </div>
      
      <button type="submit" class="generate-btn">
        ✨ Generate QR Code
      </button>
    </form>

    {% if qr_generated %}
      <div class="qr-result">
        <p class="qr-title">🎉 Your QR Code is Ready!</p>
        
        <div class="qr-container">
          <img src="{{ url_for('static', filename='qr.png') }}" alt="QR Code">
        </div>
        
        <a href="{{ url_for('static', filename='qr.png') }}" download="qr-code.png" class="download-btn">
          📱 Download QR
        </a>
      </div>
    {% endif %}
  </div>
</body>
</html>
